const CAT_EMOJI = {
  "研发工程效率": "🔧",
  "测试质量保障": "🧪",
  "内部流程自动化": "🏢",
  "内容创作生产": "🎨",
  "平台工具集成": "🛠",
  "数据查询分析": "📊",
  "业务电商客服": "💼",
  "信息查询搜索": "🔍",
  "测试质量保障（占位）": "🧩",
  "生活娱乐整活": "😄",
  "安全合规": "🔒"
};

const FUN_CATS = ["生活娱乐整活"];
const SEC_CATS = ["安全合规"];

let activeFilter = "全部";
const cats = ["全部", ...Object.keys(CAT_EMOJI)];

// 初始化筛选按钮
const pillContainer = document.getElementById("filterPills");
cats.forEach(cat => {
  const pill = document.createElement("button");
  const emoji = CAT_EMOJI[cat] || "";
  const count = cat === "全部" ? DATA.length : DATA.filter(r => r.cat === cat).length;
  pill.className = "pill" + (cat === "全部" ? " active" : "");
  pill.textContent = (emoji ? emoji + " " : "") + cat + " " + count;
  pill.dataset.cat = cat;
  pill.onclick = () => {
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    activeFilter = cat;
    applyFilters();
  };
  pillContainer.appendChild(pill);
});

function highlight(text, kw) {
  if (!kw) return text;
  const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(escaped, 'gi'), m => `<span class="highlight">${m}</span>`);
}

function applyFilters() {
  const kw = document.getElementById("searchInput").value.trim().toLowerCase();
  let filtered = DATA;
  if (activeFilter !== "全部") {
    filtered = filtered.filter(r => r.cat === activeFilter);
  }
  if (kw) {
    filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(kw) ||
      r.desc.toLowerCase().includes(kw)
    );
  }
  document.getElementById("countDisplay").textContent = filtered.length;
  document.getElementById("catDisplay").textContent = activeFilter !== "全部" ? `分类：${CAT_EMOJI[activeFilter] || ""} ${activeFilter}` : "";
  renderGrid(filtered, kw);
}

function renderGrid(items, kw) {
  const grid = document.getElementById("grid");
  if (items.length === 0) {
    grid.innerHTML = '<div class="no-result"><div class="emoji">🔍</div>没有找到匹配的 Skill</div>';
    return;
  }
  grid.innerHTML = items.map(r => {
    const isFun = FUN_CATS.includes(r.cat);
    const isSec = SEC_CATS.includes(r.cat);
    const tagClass = isFun ? "cat-tag fun" : isSec ? "cat-tag sec" : "cat-tag";
    const nameHtml = highlight(r.name, kw);
    const descHtml = highlight(r.desc, kw);
    return `<div class="card">
      <div class="card-header">
        <div class="skill-name">${nameHtml}</div>
        <span class="${tagClass}">${CAT_EMOJI[r.cat] || ""} ${r.cat}</span>
      </div>
      <div class="skill-desc">${descHtml}</div>
    </div>`;
  }).join("");
}

applyFilters();
</script>
</body>
</html>
